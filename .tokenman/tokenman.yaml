# Tokenman runtime config for the LIBRARY REPO'S own dogfood.
# Consumers have identical structure but different values.
# See docs/spec.md §3.4 for the consumer equivalent.

schedule:
  strategy: manual             # narrow README smoke test only
  # target_utilization: 80%    # applies when strategy is 'adaptive' (see spec §7.3)
  min_interval: 48h
  max_interval: 14d
  pause_at: 95%

budget:
  # Library-specific cap: keep narrow and explicit during README-only dogfood.
  per_run_tokens: 300000
  per_skill_weekly_tokens: 600000
  global_weekly_tokens: 600000

skills:
  # Phase 3: README-only dogfood.
  - readme-maintainer

retention:
  artifacts_days: 14           # stricter than consumer default (30)

dogfood:
  phase: 3                     # narrow README smoke gate
  pause_committed: false
