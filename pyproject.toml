[project]
name = "tokenman-dev"
version = "0.0.0"
description = "Dev tooling for the tokenman library repo (not a published package)"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.21",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
