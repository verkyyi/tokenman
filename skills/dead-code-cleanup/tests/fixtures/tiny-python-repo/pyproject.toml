[project]
name = "tinypkg"
version = "0.0.1"
description = "Tiny fixture for the dead-code-cleanup skill"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
